name: Build Gamma BTC Hunter
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gamma:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pinned source
        run: |
          mkdir native
          unzip -q AxeForge-RU-FIX10-BTC-HUNTER-source.zip -d native
          git clone --depth 1 --branch v1.4.10 https://github.com/IsSasoriDev/AxeForge.git upstream
          python3 native/apply.py upstream
      - name: Host tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libmbedtls-dev libcjson-dev
          make -C upstream/test
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Inative/overlay/main native/tests/math.cpp -o /tmp/axe_math
          /tmp/axe_math
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Inative/tests/stubs -Inative/overlay/main native/tests/hunter.cpp -o /tmp/axe_hunter
          /tmp/axe_hunter
          python3 - <<'PY'
          import re, pathlib, subprocess
          s = pathlib.Path('upstream/main/web/index.html').read_text()
          for i, x in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S)):
              p = pathlib.Path('/tmp') / f'axe-{i}.js'
              p.write_text(x)
              subprocess.run(['node', '--check', str(p)], check=True)
          PY
      - name: Compile ESP32-S3 Gamma OTA
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: |
            set -euo pipefail
            cd upstream
            idf.py -B build_gamma -D SDKCONFIG=build_gamma/sdkconfig -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.gamma' build
            python3 ../native/verify_image.py build_gamma/axeforge.bin
            esptool.py --chip esp32s3 image_info build_gamma/axeforge.bin
      - name: Package verified OTA
        run: |
          mkdir -p dist
          cp upstream/build_gamma/axeforge.bin dist/axeforge-gamma-RU-fix10-btc-hunter.bin
          python3 native/verify_image.py dist/axeforge-gamma-RU-fix10-btc-hunter.bin
          cd dist
          sha256sum *.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Gamma-BTC-Hunter-OTA
          path: dist/*
          if-no-files-found: error
