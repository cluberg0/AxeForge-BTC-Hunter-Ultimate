name: Export ONE-TUNER source snapshot
on:
  push:
    paths: ['.github/workflows/export-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare full source snapshot
        run: |
          mkdir -p project
          unzip -q AxeForge-ONESEARCH-build.zip -d project
          cd project
          bash scripts/prepare.sh
          python3 ../fastsearch_overlay.py .
          python3 ../one_tuner_overlay.py .
          cd ..
          zip -q -r source-snapshot.zip project -x '*/build*/*' '*/.venv/*' '*/node_modules/*' '*/.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: ONE-TUNER-SOURCE-SNAPSHOT
          path: source-snapshot.zip
          if-no-files-found: error
