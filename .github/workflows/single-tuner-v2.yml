name: Build Gamma FASTSEARCH NVS V4
on:
  workflow_dispatch:
  push:
    paths:
      - 'one_tuner_nvs_v4.py'
      - 'fastsearch_fix.patch'
      - 'fastsearch_regression.py'
      - 'single_tuner_ui.py'
      - 'diagnostics_share.py'
      - 'single_tuner_js.py'
      - 'single_tuner_backend.py'
      - 'single_tuner_version.py'
      - 'fastsearch_overlay.py'
      - '.github/workflows/single-tuner-v2.yml'
      - 'one_tuner_recovery_v3.py'
      - 'one_tuner_nvs_v3.py'
      - 'single_tuner_validate.py'
      - 'single_tuner_browser_test.py'
permissions:
  contents: read
jobs:
  gamma:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified ONESEARCH base
        run: |
          test -f AxeForge-ONESEARCH-build.zip
          mkdir -p project
          unzip -q AxeForge-ONESEARCH-build.zip -d project
          test -f project/one-search.patch
      - name: Prepare FASTSEARCH FIXED and run native regression tests
        working-directory: project
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb g++ make libmbedtls-dev libcjson-dev python3-yaml python3-jsonschema
          bash scripts/prepare.sh
          python3 ../fastsearch_overlay.py .
          python3 ../one_tuner_overlay.py .
          python3 ../single_tuner_ui.py .
          python3 ../single_tuner_js.py .
          python3 ../diagnostics_share.py .
          python3 ../single_tuner_backend.py .
          python3 ../one_tuner_recovery_v3.py .
          python3 ../one_tuner_nvs_v3.py .
          python3 ../one_tuner_nvs_v4.py .
          python3 ../single_tuner_version.py .
          python3 ../single_tuner_validate.py .
          python3 ../single_tuner_browser_test.py .
          python3 ../fastsearch_regression.py .
          echo '=== Turbo native test source and runner ==='
          sed -n '1,100p' scripts/test.sh
          echo '=== Native test run ==='
          # Run sanitizer-enabled tests directly: LeakSanitizer cannot run under ptrace.
          # Preserve failing test's source location and verify NVS fixture preconditions.
          sed -i 's/-std=c++17 -Wall -Wextra -Werror/-std=c++17 -g -O0 -Wall -Wextra -Werror/' scripts/test.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tests/turbo.cpp")
          s=p.read_text()
          needle='saved["config"][0]^=1;'
          assert s.count(needle)==1
          s=s.replace(needle, 'assert(saved.count("config") && !saved.at("config").empty() && "NVS config fixture missing");saved.at("config")[0]^=1;')
          p.write_text(s)
          PY
          bash scripts/test.sh

      - name: Browser regression tests
        working-directory: project
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright pyyaml jsonschema
          .venv/bin/python -m playwright install --with-deps chromium webkit
          .venv/bin/python tests/browser.py
          BROWSER=webkit .venv/bin/python tests/browser.py
      - name: Compile ESP32-S3 Gamma FASTSEARCH FIXED OTA
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: cd project && bash scripts/build.sh
      - name: Verify and name FASTSEARCH FIXED OTA
        working-directory: project
        run: |
          # ESP-IDF CI action creates the dist directory as root in its Docker container.
          # Restore ownership before renaming or writing the checksum in the host runner.
          sudo chown -R "$(id -u):$(id -g)" dist/unlock
          chmod -R u+rwX dist/unlock
          cd dist/unlock
          sha256sum -c SHA256SUMS.txt
          mv axeforge-gamma-BTC-HUNTER-TURBO1000-ONESEARCH.bin axeforge-gamma-FASTSEARCH-NVS-V4-OTA.bin
          sha256sum axeforge-gamma-FASTSEARCH-NVS-V4-OTA.bin > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cd ../..
          python3 verify_image.py dist/unlock/axeforge-gamma-FASTSEARCH-NVS-V4-OTA.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Gamma-FASTSEARCH-NVS-V4-OTA
          path: |
            project/dist/unlock/axeforge-gamma-FASTSEARCH-NVS-V4-OTA.bin
            project/dist/unlock/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Gamma-FASTSEARCH-FIXED-debug
          path: |
            project/upstream/build_gamma/axeforge.elf
            project/upstream/build_gamma/axeforge.map
            project/reports/build.log
            project/reports/image-info.txt
            project/reports/image-verification.txt
            project/reports/build-inputs.after.json
          if-no-files-found: error
