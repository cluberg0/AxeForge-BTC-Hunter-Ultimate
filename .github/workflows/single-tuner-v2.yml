name: Build Gamma ONE-TUNER V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'single_tuner_ui.py'
      - 'single_tuner_js.py'
      - 'single_tuner_backend.py'
      - 'single_tuner_version.py'
      - 'fastsearch_overlay.py'
      - '.github/workflows/single-tuner-v2.yml'
      - 'single_tuner_validate.py'
permissions:
  contents: read
jobs:
  gamma:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified ONESEARCH base
        run: |
          test -f AxeForge-ONESEARCH-build.zip
          mkdir -p project
          unzip -q AxeForge-ONESEARCH-build.zip -d project
          test -f project/one-search.patch
      - name: Prepare ONLY ONE-TUNER-V2 and run native regression tests
        working-directory: project
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libmbedtls-dev libcjson-dev python3-yaml python3-jsonschema
          bash scripts/prepare.sh
          python3 ../fastsearch_overlay.py .
          python3 ../one_tuner_overlay.py .
          python3 ../single_tuner_ui.py .
          python3 ../single_tuner_js.py .
          python3 ../single_tuner_backend.py .
          python3 ../single_tuner_version.py .
          python3 ../single_tuner_validate.py .
          bash scripts/test.sh
      - name: Browser regression tests
        working-directory: project
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright pyyaml jsonschema
          .venv/bin/python -m playwright install --with-deps chromium webkit
          .venv/bin/python tests/browser.py
          BROWSER=webkit .venv/bin/python tests/browser.py
      - name: Compile ESP32-S3 Gamma ONE-TUNER-V2 OTA
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: cd project && bash scripts/build.sh
      - name: Verify and name ONE-TUNER-V2 OTA
        working-directory: project
        run: |
          # ESP-IDF CI action creates the dist directory as root in its Docker container.
          # Restore ownership before renaming or writing the checksum in the host runner.
          sudo chown -R "$(id -u):$(id -g)" dist/unlock
          chmod -R u+rwX dist/unlock
          cd dist/unlock
          sha256sum -c SHA256SUMS.txt
          mv axeforge-gamma-BTC-HUNTER-TURBO1000-ONESEARCH.bin axeforge-gamma-BTC-HUNTER-TURBO1000-ONE-TUNER-V2.bin
          sha256sum axeforge-gamma-BTC-HUNTER-TURBO1000-ONE-TUNER-V2.bin > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cd ../..
          python3 verify_image.py dist/unlock/axeforge-gamma-BTC-HUNTER-TURBO1000-ONE-TUNER-V2.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Gamma-ONE-TUNER-V2-OTA
          path: |
            project/dist/unlock/axeforge-gamma-BTC-HUNTER-TURBO1000-ONE-TUNER-V2.bin
            project/dist/unlock/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Gamma-ONE-TUNER-V2-debug
          path: |
            project/upstream/build_gamma/axeforge.elf
            project/upstream/build_gamma/axeforge.map
            project/reports/build.log
            project/reports/image-info.txt
            project/reports/image-verification.txt
            project/reports/build-inputs.after.json
          if-no-files-found: error
