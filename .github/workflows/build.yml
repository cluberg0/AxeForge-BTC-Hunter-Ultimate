name: Build Gamma BTC Hunter
on:
  workflow_dispatch:
  push:
    paths: ['overlay/**', 'scripts/**', 'tests/**', '*.py', '*.inc', '*.patch', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  gamma:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source
        run: bash scripts/prepare.sh
      - name: Host and browser tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libmbedtls-dev libcjson-dev python3-yaml python3-jsonschema
          bash scripts/test.sh
          python3 -m venv .venv
          .venv/bin/pip install playwright pyyaml jsonschema
          .venv/bin/python -m playwright install --with-deps chromium webkit
          .venv/bin/python tests/browser.py
          BROWSER=webkit .venv/bin/python tests/browser.py
      - name: Compile ESP32-S3 Gamma OTA
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: bash scripts/build.sh
      - name: Verify artifact again
        run: python3 verify_image.py dist/unlock/axeforge-gamma-BTC-HUNTER-TURBO1000-UNLOCK.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Gamma-BTC-Hunter-OTA
          path: |
            dist/*
            reports/build.log
            reports/size.txt
            reports/image-info.txt
            reports/image-verification.txt
            test-results/**
          if-no-files-found: error
