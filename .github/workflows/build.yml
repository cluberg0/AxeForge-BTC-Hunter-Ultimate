name: Build Gamma BTC Hunter
on:
  workflow_dispatch:
  push:
    paths: ['overlay/**', 'scripts/**', 'tests/**', '*.py', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  gamma:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check project source is present
        run: |
          test -f scripts/prepare.sh
          test -f scripts/test.sh
          test -f scripts/build.sh
          test -f verify_image.py
      - name: Prepare pinned source
        run: bash scripts/prepare.sh
      - name: Host and browser tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libmbedtls-dev libcjson-dev
          bash scripts/test.sh
          python3 -m venv .venv
          .venv/bin/pip install playwright
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python tests/browser.py
      - name: Compile ESP32-S3 Gamma OTA
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: bash scripts/build.sh
      - name: Verify artifact
        run: python3 verify_image.py dist/axeforge-gamma-RU-fix10-btc-hunter.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Gamma-BTC-Hunter-OTA
          path: dist/*
          if-no-files-found: error
